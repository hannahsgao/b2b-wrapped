<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0;url=../stanford.html" />
</head>
<body>
  <p>Redirecting to the Stanford leaderboard…</p>
  <script>
    (function () {
      const target = new URL('../stanford.html', window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
